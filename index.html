<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PopMart Reseller Pro</title>
    
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- Header -->
            <div class="header">
                <h1>{{ appTitle }}</h1>
                <p>Manage Your Plushie Business</p>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <component :is="currentPage"></component>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <div 
                    v-for="item in navItems" 
                    :key="item.id"
                    class="nav-item" 
                    :class="{ active: currentPage === item.component }"
                    @click="switchPage(item.component)"
                >
                    <i :class="item.icon"></i>
                    <span>{{ item.label }}</span>
                </div>
            </div>

            <!-- Notification -->
            <transition name="slide-down">
                <div v-if="notification.show" class="notification" :class="'notification-' + notification.type">
                    {{ notification.message }}
                </div>
            </transition>
        </div>
    </div>

    <!-- Store -->
    <script src="js/store/store.js"></script>
    
    <!-- Components -->
    <script src="js/components/Dashboard.js"></script>
    <script src="js/components/Inventory.js"></script>
    <script src="js/components/XHSPage.js"></script>
    <script src="js/components/PredictionPage.js"></script>
    
    <!-- Main App -->
    <script src="js/app.js"></script>
</body>
</html>
